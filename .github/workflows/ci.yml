name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The published example bundle must verify with the published verifier, or the
      # repository is telling visitors something untrue.
      - name: Verify the example bundle
        run: |
          go build -o loomseal .
          ./loomseal verify examples/audit.loomseal.json --evidence examples/evidence

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The conformance vectors are what third parties implement against, so the checked-in
      # bundles must be exactly what the generator produces. Regenerate and fail on any drift.
      - name: Vectors match the generator
        run: |
          go run testdata/vectors/generate.go
          git diff --exit-code testdata/vectors

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The independent Python verifier must agree with every conformance vector. If it and the
      # Go verifier ever disagree, the format has drifted from at least one implementation.
      - name: Independent verifier agrees with the vectors
        run: |
          pip install -r reference/requirements.txt
          python3 reference/loomverify.py --vectors testdata/vectors

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          if ! go run golang.org/x/vuln/cmd/govulncheck@latest ./...; then
            echo "::warning title=govulncheck::Vulnerabilities found; review the log above."
          fi
