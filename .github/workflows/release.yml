name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A verifier nobody can run is worthless, so the archives are only built after the
      # binary proves itself against the published example bundle.
      - name: Verify the example bundle
        run: |
          go build -o loomseal .
          ./loomseal verify examples/audit.loomseal.json --evidence examples/evidence

      - name: Build the archives
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG:-$(git describe --tags --always)}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            stage="dist/stage"
            rm -rf "$stage"
            mkdir -p "$stage"
            bin="loomseal"
            if [ "$goos" = "windows" ]; then
              bin="loomseal.exe"
            fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X github.com/kordloom/loomseal/cmd.version=${version#v}" \
              -o "$stage/$bin" .
            cp LICENSE README.md FORMAT.md "$stage/"
            name="loomseal_${version#v}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -qr "../${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C "$stage" .
            fi
          done
          rm -rf dist/stage
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Attach the archives to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      # Regenerate the Homebrew cask in kordloom/homebrew-tap from this release's checksums.
      #
      # A cask failure costs the cask and nothing else. The release is already published and
      # complete by the time this runs, so continue-on-error is the whole point: this step failed
      # the v1.0.0 release while every artifact had uploaded correctly, which is a red badge on a
      # good release and an alarm that means nothing.
      #
      # The token is read from HOMEBREW_TAP_TOKEN first. An empty-string guard cannot catch the
      # failure that actually happens, which is a secret that exists and holds a stale token: the
      # guard passes and the push 401s. Fine-grained tokens also pass any permissions probe,
      # because that field reflects the owner's rights rather than the token's, so only a real
      # write proves a token. That is why this step must never be load-bearing.
      - name: Update the Homebrew cask
        if: github.event_name == 'release'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' && secrets.HOMEBREW_TAP_TOKEN || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no tap token configured, so the cask is left alone" >&2
            exit 0
          fi
          version="${TAG#v}"
          sha() { awk -v f="loomseal_${version}_$1" '$2 == f {print $1}' dist/SHA256SUMS; }
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            test -n "$(sha "${target}.tar.gz")" || { echo "missing checksum for ${target}"; exit 1; }
          done
          cat > loomseal.rb <<CASK
          cask "loomseal" do
            version "${version}"

            on_macos do
              on_intel do
                sha256 "$(sha darwin_amd64.tar.gz)"
                url "https://github.com/kordloom/loomseal/releases/download/v#{version}/loomseal_#{version}_darwin_amd64.tar.gz"
              end
              on_arm do
                sha256 "$(sha darwin_arm64.tar.gz)"
                url "https://github.com/kordloom/loomseal/releases/download/v#{version}/loomseal_#{version}_darwin_arm64.tar.gz"
              end
            end

            on_linux do
              on_intel do
                sha256 "$(sha linux_amd64.tar.gz)"
                url "https://github.com/kordloom/loomseal/releases/download/v#{version}/loomseal_#{version}_linux_amd64.tar.gz"
              end
              on_arm do
                sha256 "$(sha linux_arm64.tar.gz)"
                url "https://github.com/kordloom/loomseal/releases/download/v#{version}/loomseal_#{version}_linux_arm64.tar.gz"
              end
            end

            name "loomseal"
            desc "Open format for evidence someone else can check: signed, chained, anchored, verified offline"
            homepage "https://loomseal.com"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "loomseal"
          end
          CASK
          content=$(base64 -w0 loomseal.rb)
          existing=$(gh api repos/kordloom/homebrew-tap/contents/Casks/loomseal.rb --jq .sha 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh api -X PUT repos/kordloom/homebrew-tap/contents/Casks/loomseal.rb \
              -f message="Update loomseal cask to ${version}" -f content="$content" -f sha="$existing" > /dev/null
          else
            gh api -X PUT repos/kordloom/homebrew-tap/contents/Casks/loomseal.rb \
              -f message="Add loomseal cask ${version}" -f content="$content" > /dev/null
          fi
          echo "cask updated to ${version}"
